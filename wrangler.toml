name = "cf-mail-onetime"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "cf_mail_db"
database_id = "42a66faf-d59c-48e0-8d3c-faeddc64956f"

[[r2_buckets]]
binding = "R2"
bucket_name = "cf-mail-storage"

[vars]
ADMIN_PASSWORD = "Changeyourpasswordbeforeusingcfmail"

[assets]
directory = "dist/client"
run_worker_first = ["/api", "/api/*"]
